<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึก UPDATE ต่างๆ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        inputBg: '#090d16',
                        accentYellow: '#f59e0b',
                        accentPurple: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-cardBg rounded-2xl p-6 shadow-2xl border border-slate-800 relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 text-xl">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <h1 class="text-xl font-semibold tracking-wide">บันทึก UPDATE ต่างๆ</h1>
            </div>
            <button onclick="runAiSmart()" class="flex items-center space-x-1.5 bg-slate-800/80 hover:bg-slate-700 text-purple-400 text-xs px-3 py-1.5 rounded-full border border-purple-500/30 transition-all shadow-inner">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="font-medium">AI Smart</span>
            </button>
        </div>

        <!-- Input Area -->
        <div class="mb-4">
            <textarea id="noteInput" rows="3" placeholder="พิมพ์ข้อความ ไอเดีย งานที่ต้องทำ หรือโน้ตสั้นๆ ตรงนี้..." class="w-full bg-inputBg text-slate-200 placeholder-slate-500 text-sm rounded-xl p-4 border border-slate-800 focus:outline-none focus:border-purple-500/50 resize-none transition-all shadow-inner"></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center space-x-3 mb-6">
            <button onclick="addNote()" id="submitBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition-all shadow-lg shadow-amber-500/10 active:scale-[0.99]">
                <i class="fa-solid fa-circle-plus text-base"></i>
                <span>เพิ่มบันทึก</span>
            </button>
            <button onclick="runAiSimulation()" class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition-all shadow-lg shadow-purple-600/10 active:scale-[0.99]">
                <i class="fa-solid fa-microchip text-base"></i>
                <span>สรุปด้วย AI</span>
            </button>
        </div>

        <!-- AI Analysis Box (Hidden by default) -->
        <div id="aiBox" class="hidden mb-6 bg-slate-900/90 border border-purple-500/30 rounded-xl p-4 relative shadow-inner animate-fadeIn">
            <button onclick="closeAiBox()" class="absolute top-3 right-3 text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="flex items-center space-x-2 text-purple-400 mb-2">
                <i class="fa-solid fa-robot text-sm"></i>
                <span class="text-xs font-semibold tracking-wider uppercase">ผลการวิเคราะห์จาก AI</span>
            </div>
            <p id="aiResultText" class="text-xs text-slate-300 leading-relaxed pr-4"></p>
        </div>

        <!-- Notes Feed -->
        <div id="notesContainer" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
            <!-- Dynamic Notes will load here -->
            <div class="text-center text-slate-500 text-xs py-6">กำลังโหลดข้อมูลจาก Google Sheets...</div>
        </div>

    </div>

    <script>
        const SHEETDB_URL = 'https://sheetdb.io/api/v1/cq7ghrqhdz3ar';

        // โหลดข้อมูลเมื่อเปิดเว็บ
        window.addEventListener('DOMContentLoaded', fetchNotes);

        async function fetchNotes() {
            const container = document.getElementById('notesContainer');
            try {
                const response = await fetch(SHEETDB_URL);
                const data = await response.json();
                
                container.innerHTML = '';
                if (data.length === 0) {
                    container.innerHTML = '<div class="text-center text-slate-500 text-xs py-6">ยังไม่มีบันทึกข้อความ</div>';
                    return;
                }

                // แสดงข้อมูลล่าสุดไว้ด้านบน
                data.reverse().forEach(note => {
                    const card = document.createElement('div');
                    card.className = 'bg-inputBg/60 border border-slate-800/80 rounded-xl p-4 transition-all hover:border-slate-700';
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-2">
                            <span class="bg-slate-800 text-slate-300 text-[10px] px-2.5 py-0.5 rounded-full font-medium">${note.category || 'ทั่วไป'}</span>
                            <span class="text-[10px] text-slate-500">${note.time || ''}</span>
                        </div>
                        <p class="text-sm text-slate-200 whitespace-pre-wrap break-words">${note.content}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<div class="text-center text-red-400 text-xs py-6">ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้</div>';
            }
        }

        async function addNote() {
            const input = document.getElementById('noteInput');
            const content = input.value.trim();
            if (!content) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            
            const newRecord = {
                data: {
                    content: content,
                    category: 'ทั่วไป',
                    time: timeStr
                }
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i><span>กำลังบันทึก...</span>';

            try {
                await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRecord)
                });

                input.value = '';
                fetchNotes();
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการบันทึก');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-circle-plus text-base"></i><span>เพิ่มบันทึก</span>';
            }
        }

        async function runAiSimulation() {
            const aiBox = document.getElementById('aiBox');
            const aiText = document.getElementById('aiResultText');
            aiBox.classList.remove('hidden');
            aiText.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> กำลังวิเคราะห์ข้อมูล...';

            try {
                const response = await fetch(SHEETDB_URL);
                const data = await response.json();
                
                if(data.length === 0) {
                    aiText.innerText = 'ยังไม่มีข้อมูลพอสำหรับการวิเคราะห์ กรุณาเพิ่มโน้ตก่อนครับ';
                    return;
                }

                setTimeout(() => {
                    aiText.innerText = `สรุปจากโน้ตทั้งหมด ${data.length} รายการ: หัวข้อหลักของคุณเน้นไปที่เรื่อง "ทั่วไป" (${data.length} รายการ) ข้อแนะนำ: ควรจัดลำดับความสำคัญของงานด่วน และติดตามรายการอัพเดตอย่างสม่ำเสมอ`;
                }, 600);
            } catch (e) {
                aiText.innerText = 'ไม่สามารถประมวลผล AI ได้ในขณะนี้';
            }
        }

        function closeAiBox() {
            document.getElementById('aiBox').classList.add('hidden');
        }

        function runAiSmart() {
            alert('AI Smart Mode เปิดใช้งานแล้ว พร้อมช่วยคุณจัดการข้อความ!');
        }
    </script>
</body>
</html>
