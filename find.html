<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางข้อมูลจาก Google Sheets</title>
    <!-- PapaParse สำหรับแปลง CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f4f7fc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin: 0 0 8px 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        /* ----- ช่องค้นหา ----- */
        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }

        .search-wrapper input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: #fff;
        }

        .search-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            opacity: 0.6;
        }

        .result-count {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 12px;
            text-align: right;
        }

        /* ----- ตาราง ----- */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            max-height: 70vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            white-space: nowrap;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead th {
            background: #1e293b;
            color: #fff;
            padding: 14px 18px;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #0f172a;
        }

        tbody td {
            padding: 12px 18px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #e0f2fe;
            transition: background 0.15s;
        }

        /* แถวเมื่อค้นหาไม่พบ */
        .no-result td {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-style: italic;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 16px 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Scrollbar สวย ๆ */
        .table-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            h1 { font-size: 1.4rem; }
            thead th, tbody td { padding: 10px 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📊 ตารางข้อมูล</h1>
        <p class="subtitle">ค้นหาได้จากทุกคอลัมน์</p>

        <!-- ช่องค้นหา -->
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="พิมพ์คำค้นหา..." autocomplete="off">
        </div>

        <div class="result-count" id="resultCount"></div>

        <!-- ตาราง -->
        <div class="table-container" id="tableContainer">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1) วางลิงก์ CSV ของ Google Sheets ที่นี่
        // ============================================================
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQlV0oAwttSP8AQgrjkLAUsOX5iHnizQFxT7u5fafxIyWFeLz-_Lq8CCknsqmHRrohCQ9IQYPajDa2I/pub?output=csv';

        // ============================================================
        // 2) ตัวแปรเก็บข้อมูลทั้งหมด
        // ============================================================
        let allData = [];      // Array of objects (แต่ละแถว)
        let headers = [];      // ชื่อคอลัมน์

        const searchInput    = document.getElementById('searchInput');
        const tableContainer = document.getElementById('tableContainer');
        const resultCount    = document.getElementById('resultCount');
        const loadingEl      = document.getElementById('loading');

        // ============================================================
        // 3) ฟังก์ชันโหลด CSV
        // ============================================================
        async function loadCSV() {
            try {
                const response = await fetch(CSV_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} – ไม่สามารถเข้าถึงไฟล์ได้`);
                }

                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,          // แถวแรกเป็นชื่อคอลัมน์
                    skipEmptyLines: true,
                    dynamicTyping: false,  // เก็บเป็น string ทั้งหมดเพื่อการค้นหาที่แม่นยำ
                    complete: function (results) {
                        if (results.errors.length > 0) {
                            console.warn('CSV parsing warnings:', results.errors);
                        }

                        allData = results.data;
                        headers = results.meta.fields || [];

                        if (allData.length === 0) {
                            showError('ไม่พบข้อมูลในไฟล์ CSV');
                            return;
                        }

                        renderTable(allData);
                        updateResultCount(allData.length, allData.length);
                    },
                    error: function (err) {
                        showError('เกิดข้อผิดพลาดในการแปลง CSV: ' + err.message);
                    }
                });

            } catch (error) {
                console.error(error);
                showError(
                    'ไม่สามารถโหลดข้อมูลได้<br><br>' +
                    '<strong>สาเหตุที่เป็นไปได้:</strong><br>' +
                    '• ลิงก์ CSV อาจไม่ถูกต้องหรือหมดอายุ<br>' +
                    '• ไฟล์อาจไม่ได้แชร์แบบ "Anyone with the link can view"<br>' +
                    '• เบราว์เซอร์อาจบล็อกการเชื่อมต่อ (CORS)<br><br>' +
                    '<em>ลองเปิดลิงก์ CSV ในแท็บใหม่เพื่อตรวจสอบว่ายังใช้งานได้หรือไม่</em>'
                );
            }
        }

        // ============================================================
        // 4) แสดงตาราง
        // ============================================================
        function renderTable(data) {
            if (data.length === 0) {
                tableContainer.innerHTML = `
                    <table>
                        <thead>${buildThead()}</thead>
                        <tbody>
                            <tr class="no-result">
                                <td colspan="${headers.length || 1}">🔎 ไม่พบข้อมูลที่ตรงกับคำค้นหา</td>
                            </tr>
                        </tbody>
                    </table>
                `;
                return;
            }

            const theadHTML = buildThead();
            const tbodyHTML = data.map(row => {
                const cells = headers.map(h => {
                    const val = row[h] !== undefined && row[h] !== null ? row[h] : '';
                    return `<td>${escapeHTML(String(val))}</td>`;
                }).join('');
                return `<tr>${cells}</tr>`;
            }).join('');

            tableContainer.innerHTML = `
                <table>
                    <thead>${theadHTML}</thead>
                    <tbody>${tbodyHTML}</tbody>
                </table>
            `;
        }

        function buildThead() {
            const ths = headers.map(h => `<th>${escapeHTML(h)}</th>`).join('');
            return `<tr>${ths}</tr>`;
        }

        // ============================================================
        // 5) ค้นหา (กรองข้อมูล)
        // ============================================================
        function filterData(query) {
            const q = query.trim().toLowerCase();

            if (!q) {
                renderTable(allData);
                updateResultCount(allData.length, allData.length);
                return;
            }

            const filtered = allData.filter(row => {
                return headers.some(h => {
                    const val = row[h];
                    if (val === undefined || val === null) return false;
                    return String(val).toLowerCase().includes(q);
                });
            });

            renderTable(filtered);
            updateResultCount(filtered.length, allData.length);
        }

        // ============================================================
        // 6) อัปเดตจำนวนผลลัพธ์
        // ============================================================
        function updateResultCount(shown, total) {
            if (shown === total) {
                resultCount.textContent = `แสดงทั้งหมด ${total.toLocaleString()} รายการ`;
            } else {
                resultCount.textContent = `พบ ${shown.toLocaleString()} จาก ${total.toLocaleString()} รายการ`;
            }
        }

        // ============================================================
        // 7) แสดงข้อผิดพลาด
        // ============================================================
        function showError(message) {
            tableContainer.innerHTML = `<div class="error-box">⚠️ ${message}</div>`;
            resultCount.textContent = '';
        }

        // ============================================================
        // 8) ป้องกัน XSS
        // ============================================================
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================================
        // 9) Event: ค้นหาแบบ Real-time
        // ============================================================
        let debounceTimer;
        searchInput.addEventListener('input', function () {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                filterData(this.value);
            }, 150); // หน่วง 150ms เพื่อประสิทธิภาพ
        });

        // ============================================================
        // 10) เริ่มทำงาน
        // ============================================================
        loadCSV();
    </script>

</body>
</html>
