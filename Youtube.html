<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Search — ค้นหาวิดีโอ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0b0d12; --card:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12);
    --txt:#eef1f6; --muted:#9aa3b2; --red:#ff0033; --red2:#ff4d6d;
  }
  body{
    min-height:100vh; font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
    color:var(--txt); background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
    overflow-x:hidden;
  }
  /* แสงพื้นหลัง */
  body::before, body::after{
    content:""; position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; z-index:0;
  }
  body::before{ width:420px; height:420px; background:var(--red); top:-120px; left:-120px; }
  body::after{ width:380px; height:380px; background:#3b5bff; bottom:-140px; right:-120px; }

  .wrap{ position:relative; z-index:1; width:100%; max-width:720px; }

  .logo{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; }
  .logo .play{
    width:52px; height:52px; border-radius:14px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--red),var(--red2));
    box-shadow:0 10px 30px rgba(255,0,51,.45);
  }
  .logo .play svg{ width:22px; height:22px; fill:#fff; margin-left:3px; }
  .logo h1{ font-size:clamp(22px,4vw,32px); letter-spacing:.3px; }
  .logo h1 span{ color:var(--red2); }

  .sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:26px; }

  /* กล่องค้นหา */
  .searchbox{
    display:flex; gap:10px; padding:10px; border-radius:18px;
    background:var(--card); border:1px solid var(--stroke);
    backdrop-filter:blur(14px); box-shadow:0 18px 50px rgba(0,0,0,.45);
    transition:.25s;
  }
  .searchbox:focus-within{ border-color:rgba(255,77,109,.65); box-shadow:0 0 0 4px rgba(255,0,51,.15); }

  .field{ position:relative; flex:1; display:flex; align-items:center; }
  .field svg{ position:absolute; left:14px; width:18px; height:18px; fill:var(--muted); pointer-events:none; }
  .field input{
    width:100%; padding:15px 14px 15px 44px; border:none; outline:none; border-radius:12px;
    background:rgba(0,0,0,.35); color:var(--txt); font-size:16px; font-family:inherit;
  }
  .field input::placeholder{ color:#6b7484; }

  .btn{
    display:flex; align-items:center; gap:8px; padding:0 22px; border:none; cursor:pointer;
    border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; color:#fff;
    background:linear-gradient(135deg,var(--red),var(--red2));
    box-shadow:0 8px 22px rgba(255,0,51,.4); transition:.2s;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,0,51,.55); }
  .btn:active{ transform:translateY(0); }

  /* ชิปหมวด */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px; }
  .chip{
    padding:8px 16px; font-size:13px; border-radius:999px; cursor:pointer;
    color:var(--muted); background:var(--card); border:1px solid var(--stroke);
    transition:.2s; font-family:inherit;
  }
  .chip:hover{ color:#fff; border-color:var(--red2); background:rgba(255,0,51,.15); transform:translateY(-2px); }

  /* ประวัติ */
  .history{ margin-top:30px; }
  .history-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .history-head h2{ font-size:14px; color:var(--muted); font-weight:600; letter-spacing:.5px; }
  .clear{ background:none; border:none; color:var(--red2); font-size:13px; cursor:pointer; font-family:inherit; }
  .clear:hover{ text-decoration:underline; }
  .hlist{ display:flex; flex-wrap:wrap; gap:8px; }
  .hitem{
    display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; border-radius:10px;
    background:rgba(255,255,255,.05); border:1px solid var(--stroke); font-size:13px; color:var(--txt);
  }
  .hitem span{ cursor:pointer; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hitem span:hover{ color:var(--red2); }
  .hitem .x{ cursor:pointer; color:var(--muted); font-size:15px; line-height:1; }
  .hitem .x:hover{ color:var(--red2); }

  /* ตัวเลือก */
  .opts{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:24px; font-size:13px; color:var(--muted); }
  .switch{ position:relative; width:42px; height:24px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0; cursor:pointer; border-radius:999px; transition:.3s;
    background:rgba(255,255,255,.15);
  }
  .slider::before{
    content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; border-radius:50%;
    background:#fff; transition:.3s;
  }
  .switch input:checked + .slider{ background:linear-gradient(135deg,var(--red),var(--red2)); }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  @media (max-width:560px){
    .searchbox{ flex-direction:column; }
    .btn{ padding:15px; justify-content:center; }
    .field svg{ top:50%; transform:translateY(-50%); }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <h1>YouTube <span>Search</span></h1>
  </div>
  <p class="sub">พิมพ์คำค้นหา แล้วกด Enter — ระบบจะพาไปยังผลการค้นหาบน YouTube 🎬</p>

  <form class="searchbox" id="form">
    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="text" id="q" placeholder="ค้นหาวิดีโอ เพลง ข่าว สอนทำอาหาร..." autocomplete="off" autofocus>
    </div>
    <button class="btn" type="submit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
      ค้นหา
    </button>
  </form>

  <div class="chips" id="chips"></div>

  <div class="history" id="history" style="display:none">
    <div class="history-head">
      <h2>🕘 ค้นหาล่าสุด</h2>
      <button class="clear" id="clear">ล้างทั้งหมด</button>
    </div>
    <div class="hlist" id="hlist"></div>
  </div>

  <div class="opts">
    <label class="switch">
      <input type="checkbox" id="newtab" checked>
      <span class="slider"></span>
    </label>
    <span>เปิดผลการค้นหาในแท็บใหม่</span>
  </div>
</div>

<script>
  const KEY = 'yt_recent_searches';
  const form   = document.getElementById('form');
  const input  = document.getElementById('q');
  const chipsEl= document.getElementById('chips');
  const histEl = document.getElementById('history');
  const listEl = document.getElementById('hlist');
  const clearBt= document.getElementById('clear');
  const newTab = document.getElementById('newtab');

  /* ---- ชิปหมวดยอดนิยม ---- */
  const chips = ['เพลงฮิต','ข่าววันนี้','สอนเขียนโค้ด','ทำอาหาร','เกม','Podcast','ฟุตบอล','ท่องเที่ยว'];
  chips.forEach(text => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = text;
    b.onclick = () => { input.value = text; go(text); };
    chipsEl.appendChild(b);
  });

  /* ---- ค้นหา ---- */
  function go(term){
    const q = (term ?? input.value).trim();
    if(!q) { input.focus(); return; }
    const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
    save(q);
    if(newTab.checked) window.open(url, '_blank', 'noopener');
    else window.location.href = url;
  }

  form.addEventListener('submit', e => { e.preventDefault(); go(); });

  /* ---- ประวัติ ---- */
  function getList(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save(term){
    let list = getList().filter(t => t.toLowerCase() !== term.toLowerCase());
    list.unshift(term);
    localStorage.setItem(KEY, JSON.stringify(list.slice(0, 10)));
    render();
  }
  function remove(term){
    localStorage.setItem(KEY, JSON.stringify(getList().filter(t => t !== term)));
    render();
  }
  function render(){
    const list = getList();
    histEl.style.display = list.length ? 'block' : 'none';
    listEl.innerHTML = '';
    list.forEach(term => {
      const item = document.createElement('div');
      item.className = 'hitem';

      const s = document.createElement('span');
      s.textContent = term;
      s.title = term;
      s.onclick = () => { input.value = term; go(term); };

      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '✕';
      x.onclick = () => remove(term);

      item.append(s, x);
      listEl.appendChild(item);
    });
  }
  clearBt.onclick = () => { localStorage.removeItem(KEY); render(); };

  render();
</script>
</body>
</html>
