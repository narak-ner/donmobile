<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFINN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --input-bg: #f8fafc;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --danger-border: #fecaca;
    --success: #16a34a;
  }

  body {
    font-family: 'Prompt', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: clamp(16px, 3vw, 32px) 14px 48px;
  }

  .wrap { max-width: 800px; margin: 0 auto; }

  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 32px -18px rgba(15, 23, 42, .28), 0 2px 8px rgba(15, 23, 42, .04);
    padding: clamp(20px, 4vw, 34px);
  }

  /* ---------- Header + RESET ---------- */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .brand-icon {
    width: 52px; height: 52px;
    border-radius: 15px;
    display: grid; place-items: center;
    font-size: 25px;
    background: linear-gradient(135deg, #dbeafe, #eff6ff);
    border: 1px solid #bfdbfe;
    flex-shrink: 0;
  }

  h1 { font-size: clamp(16.5px, 3.4vw, 20px); font-weight: 700; color: #0f172a; line-height: 1.4; }

  .brand p { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .btn-reset {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--danger-border);
    background: var(--danger-soft);
    color: var(--danger);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: all .2s ease;
  }
  .btn-reset:hover { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 8px 18px -8px rgba(220, 38, 38, .55); }
  .btn-reset:active { transform: scale(.97); }

  .header-actions { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .btn-home {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: #334155;
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    text-decoration: none; white-space: nowrap;
    transition: all .2s ease;
  }
  .btn-home:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; box-shadow: 0 8px 18px -10px rgba(37, 99, 235, .45); }
  .btn-home:active { transform: scale(.97); }

  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    margin-top: 16px;
  }

  .autosave-note { font-size: 12px; color: var(--muted); }

  /* ---------- Sections + fields ---------- */
  h2 {
    font-size: 15px; font-weight: 700; color: #0f172a;
    border-left: 4px solid var(--primary);
    padding-left: 10px;
    margin: 28px 0 14px;
  }

  .field {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px; flex-wrap: wrap;
  }

  .field > label {
    width: 240px;
    font-size: 13.5px; font-weight: 600; color: #334155;
    padding-right: 4px;
  }

  input[type="text"], input[type="tel"], input[type="number"] {
    flex: 1; min-width: 190px;
    padding: 10px 13px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--input-bg);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3.5px rgba(37, 99, 235, .13);
  }

  /* ---------- Toggle (radio) ---------- */
  .toggle { display: flex; gap: 10px; flex: 1; min-width: 220px; }
  .toggle input { display: none; }
  .toggle label {
    flex: 1; text-align: center;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--input-bg);
    font-size: 13.5px; font-weight: 600; color: #475569;
    cursor: pointer; user-select: none;
    transition: all .2s ease;
  }
  .toggle label:hover { border-color: #cbd5e1; background: #f1f5f9; }
  .toggle input:checked + label { color: #fff; }

  /* สีของแต่ละตัวเลือก */
  #hand1:checked + label { background: #2563eb; border-color: #2563eb; }
  #hand2:checked + label { background: #7c3aed; border-color: #7c3aed; }

  #batChangeNo:checked + label { background: #16a34a; border-color: #16a34a; }
  #batChangeYes:checked + label { background: #ea580c; border-color: #ea580c; }

  #batOriginalYes:checked + label { background: #16a34a; border-color: #16a34a; }
  #batOriginalNo:checked + label { background: #dc2626; border-color: #dc2626; }

  #batAwareYes:checked + label { background: #0d9488; border-color: #0d9488; }
  #batAwareNo:checked + label { background: #e11d48; border-color: #e11d48; }

  #hasBoxNo:checked + label { background: #64748b; border-color: #64748b; }
  #hasBoxYes:checked + label { background: #4f46e5; border-color: #4f46e5; }

  #hasCableNo:checked + label { background: #64748b; border-color: #64748b; }
  #hasCableYes:checked + label { background: #0284c7; border-color: #0284c7; }

  /* ---------- Preview ---------- */
  .preview-head {
    display: flex; align-items: center; gap: 10px;
    margin: 28px 0 10px;
    font-size: 13.5px; font-weight: 700; color: #334155;
  }
  .preview-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .preview {
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 14px;
    padding: 16px 18px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
    min-height: 90px;
  }

  /* ---------- Copy + status ---------- */
  .btn-copy {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%;
    margin-top: 14px;
    padding: 14px 26px;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px rgba(37, 99, 235, .65);
    transition: all .2s ease;
  }
  .btn-copy:hover { filter: brightness(1.08); }
  .btn-copy:active { transform: scale(.985); }

  .status {
    text-align: center;
    margin-top: 12px;
    font-size: 13.5px; font-weight: 600;
    color: var(--success);
    min-height: 22px;
  }
  .status.error { color: var(--danger); }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .field > label { width: 100%; margin-bottom: 2px; }
    .field { gap: 6px; margin-bottom: 14px; }
    .btn-reset, .btn-home { padding: 9px 14px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">📱</div>
        <div>
          <h1>GFINN</h1>
          <p>บันทึกข้อมูลเครื่องมือสอง</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn-home" href="index.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"/>
            <path d="M19 12H5"/>
          </svg>
          หน้าหลัก
        </a>
        <button type="button" class="btn-reset" onclick="resetAll()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          RESET
        </button>
      </div>
    </header>

    <div class="meta-row">
      <span class="autosave-note">💾 ข้อมูลถูกบันทึกอัตโนมัติในเครื่องของคุณ</span>
    </div>

    <form id="infoForm" onsubmit="return false;">

      <div class="field">
        <label>1. ชื่อลูกค้า :</label>
        <input type="text" id="customerName" placeholder="กรอกชื่อลูกค้า">
      </div>

      <div class="field">
        <label>2. ทำอาชีพ :</label>
        <input type="text" id="occupation" placeholder="กรอกอาชีพ">
      </div>

      <div class="field">
        <label>3. สนใจโทรศัพท์รุ่น :</label>
        <input type="text" id="phoneModel" placeholder="ระบุรุ่นโทรศัพท์">
      </div>

      <div class="field">
        <label>4. มือ 1/2 :</label>
        <div class="toggle">
          <input type="radio" id="hand1" name="phoneHand" value="1">
          <label for="hand1">มือ 1</label>
          <input type="radio" id="hand2" name="phoneHand" value="2">
          <label for="hand2">มือ 2</label>
        </div>
      </div>

      <div class="field">
        <label>5. เลขอีมี่ :</label>
        <input type="text" id="imei" placeholder="กรอกเลข IMEI">
      </div>

      <div class="field">
        <label>6. เบอร์ลูกค้า :</label>
        <input type="text" id="customerPhone" inputmode="numeric" placeholder="กรอกเบอร์โทรศัพท์ (ตัวเลขเท่านั้น)">
      </div>

      <div class="field">
        <label>7. อายุ :</label>
        <input type="text" id="age" inputmode="numeric" placeholder="กรอกอายุ (ตัวเลขเท่านั้น)">
      </div>

      <div class="field">
        <label>8. แบตเปลี่ยนมาหรือไม่ ? :</label>
        <div class="toggle">
          <input type="radio" id="batChangeNo" name="batChange" value="ไม่">
          <label for="batChangeNo">ไม่</label>
          <input type="radio" id="batChangeYes" name="batChange" value="ใช่">
          <label for="batChangeYes">ใช่</label>
        </div>
      </div>

      <div class="field">
        <label>9. แบตแท้หรือไม่ ? :</label>
        <div class="toggle">
          <input type="radio" id="batOriginalYes" name="batOriginal" value="แท้">
          <label for="batOriginalYes">แท้</label>
          <input type="radio" id="batOriginalNo" name="batOriginal" value="ไม่แท้">
          <label for="batOriginalNo">ไม่แท้</label>
        </div>
      </div>

      <div class="field">
        <label>10. ลูกค้าทราบเรื่องแบตแล้วใช่หรือไม่ ? :</label>
        <div class="toggle">
          <input type="radio" id="batAwareYes" name="batAware" value="ใช่">
          <label for="batAwareYes">ใช่</label>
          <input type="radio" id="batAwareNo" name="batAware" value="ไม่">
          <label for="batAwareNo">ไม่</label>
        </div>
      </div>

      <div class="field">
        <label>11. มีกล่องหรือไม่ ? :</label>
        <div class="toggle">
          <input type="radio" id="hasBoxNo" name="hasBox" value="ไม่มี">
          <label for="hasBoxNo">ไม่มี</label>
          <input type="radio" id="hasBoxYes" name="hasBox" value="มี">
          <label for="hasBoxYes">มี</label>
        </div>
      </div>

      <div class="field">
        <label>12. มีสายชาร์จหรือไม่ ? :</label>
        <div class="toggle">
          <input type="radio" id="hasCableNo" name="hasCable" value="ไม่มี">
          <label for="hasCableNo">ไม่มี</label>
          <input type="radio" id="hasCableYes" name="hasCable" value="มี">
          <label for="hasCableYes">มี</label>
        </div>
      </div>

      <div class="field">
        <label>13. Over :</label>
        <input type="text" id="overValue" inputmode="numeric" placeholder="ระบุตัวเลข Over">
      </div>

    </form>

    <div class="preview-head">📄 พรีวิวข้อมูล (อัปเดตอัตโนมัติ)</div>
    <pre class="preview" id="preview"></pre>

    <button type="button" class="btn-copy" onclick="copyAll()">📋 คัดลอกข้อมูลทั้งหมด</button>
    <div class="status" id="status"></div>

  </div>
</div>

<script>
  const STORAGE_KEY = 'customerFormAutoSave';
  const previewEl = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  let isClearing = false; // กันการบันทึกซ้ำระหว่างล้างข้อมูล

  function getVal(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() || '-' : '-';
  }

  function getRadioVal(name) {
    const selected = document.querySelector(`input[name="${name}"]:checked`);
    return selected ? selected.value : '-';
  }

  // ===== สร้างข้อความสรุป =====
  function buildText() {
    return `รายละเอียดที่ต้องแจ้ง
1.ชื่อลูกค้า : ${getVal('customerName')}
2.ทำอาชีพ : ${getVal('occupation')}
3.สนใจโทรศัพท์รุ่น : ${getVal('phoneModel')}
4.มือ 1/2 : ${getRadioVal('phoneHand')}
5.เลขอีมี่ : ${getVal('imei')}
6.เบอร์ลูกค้า : ${getVal('customerPhone')}
7.อายุ : ${getVal('age')}
8.แบตเปลี่ยนมาหรือไม่ ? : ${getRadioVal('batChange')}
9.แบตแท้หรือไม่ ? : ${getRadioVal('batOriginal')}
10.ลูกค้าทราบเรื่องแบตแล้วใช่หรือไม่ ? : ${getRadioVal('batAware')}
11.มีกล่องหรือไม่ ? : ${getRadioVal('hasBox')}
12.มีสายชาร์จหรือไม่ ? : ${getRadioVal('hasCable')}
13.Over : ${getVal('overValue')}`;
  }

  function updatePreview() {
    previewEl.textContent = buildText();
  }

  // ===== สถานะ =====
  function showStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
    clearTimeout(statusEl._t);
    statusEl._t = setTimeout(() => { statusEl.textContent = ''; }, 2200);
  }

  // ===== บันทึกอัตโนมัติ =====
  function saveData() {
    if (isClearing) return;
    const formData = {};
    document.querySelectorAll('#infoForm input').forEach(input => {
      if (input.type === 'radio') {
        if (input.checked) formData[input.name] = input.value;
      } else {
        formData[input.id] = input.value;
      }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
    showStatus('💾 บันทึกอัตโนมัติแล้ว');
  }

  // ===== โหลดข้อมูล =====
  function loadData() {
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (!savedData) return;
    try {
      const formData = JSON.parse(savedData);
      document.querySelectorAll('#infoForm input').forEach(input => {
        if (input.type === 'radio') {
          if (formData[input.name] && input.value === formData[input.name]) input.checked = true;
        } else {
          if (formData[input.id] !== undefined) input.value = formData[input.id];
        }
      });
    } catch (e) {
      console.error('โหลดข้อมูลไม่สำเร็จ', e);
    }
  }

  // ===== คัดลอกข้อความ =====
  function copyAll() {
    const text = buildText();
    const done = () => showStatus('✅ คัดลอกข้อมูลทั้งหมดแล้ว');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { showStatus('❌ คัดลอกไม่สำเร็จ', true); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  // ===== ล้างข้อมูล (RESET) =====
  function resetAll() {
    if (!confirm('ต้องการล้างข้อมูลทั้งหมดใช่หรือไม่?')) return;
    isClearing = true;
    document.querySelectorAll('#infoForm input').forEach(input => {
      if (input.type === 'radio') input.checked = false;
      else input.value = '';
    });
    localStorage.removeItem(STORAGE_KEY);
    updatePreview();
    showStatus('🗑️ ล้างข้อมูลเรียบร้อยแล้ว');
    setTimeout(() => { isClearing = false; }, 150);
  }

  // ===== เริ่มต้น =====
  loadData();
  updatePreview();

  // กรองเฉพาะตัวเลขสำหรับช่องเบอร์ / อายุ / Over
  ['customerPhone', 'age', 'overValue'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
      });
    }
  });

  // อัปเดตพรีวิว + บันทึกอัตโนมัติเมื่อพิมพ์หรือเลือกตัวเลือก
  const form = document.getElementById('infoForm');
  form.addEventListener('input', () => { updatePreview(); saveData(); });
  form.addEventListener('change', () => { updatePreview(); saveData(); });
</script>
</body>
</html>
