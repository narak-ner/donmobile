<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚡ Live HTML Tester</title>
<style>
  :root{
    --bg:#1e1e2e; --panel:#181825; --panel2:#252538; --border:#313244;
    --text:#cdd6f4; --muted:#7f849c;
    --accent:#89b4fa; --green:#a6e3a1; --red:#f38ba8; --yellow:#f9e2af;
    --gutter:#12121c;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  .app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  header{
    height:52px; flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:0 12px; border-bottom:1px solid var(--border);
    background:var(--panel); overflow-x:auto;
  }
  .brand{ font-weight:700; font-size:14.5px; white-space:nowrap; }
  .switch{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap; }
  .switch input{ accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
  .status{ font-size:12px; color:var(--muted); white-space:nowrap; }
  .status.flash{ color:var(--green); }
  .spacer{ flex:1; }

  .btn{
    background:#2a2a3d; color:var(--text); border:1px solid var(--border);
    padding:6px 11px; border-radius:7px; font-size:12.5px; cursor:pointer;
    transition:.15s; font-family:inherit; white-space:nowrap;
  }
  .btn:hover:not(:disabled){ background:#35354d; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); color:#11111b; border-color:var(--accent); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.1); }
  .btn.tiny{ padding:4px 8px; font-size:11px; border-radius:5px; }
  .btn.active{ background:var(--accent); color:#11111b; border-color:var(--accent); font-weight:600; }
  .btn.export{ background:var(--green); color:#11111b; border-color:var(--green); font-weight:600; }
  .btn.export:hover{ filter:brightness(1.1); }
  .btn.icon{ padding:6px 9px; font-size:14px; }

  main{ flex:1; display:flex; min-height:0; }
  .pane{ display:flex; flex-direction:column; min-width:0; min-height:0; }
  #editorPane{ width:50%; flex:0 0 auto; position:relative; }
  #previewPane{ flex:1; position:relative; }
  .pane-flash::after{
    content:''; position:absolute; inset:0; z-index:20;
    pointer-events:none;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .splitter{ width:6px; flex:0 0 auto; cursor:col-resize; background:var(--border); transition:background .15s; }
  .splitter:hover{ background:var(--accent); }

  .tabs{
    display:flex; gap:2px; padding:5px 8px 0; background:var(--panel);
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .tab{
    background:transparent; border:0; border-bottom:2px solid transparent;
    color:var(--muted); padding:7px 14px; font-size:12.5px; cursor:pointer;
    font-family:ui-monospace,Menlo,Consolas,monospace; transition:.15s;
  }
  .tab:hover{ color:var(--text); }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }

  .selection-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:5px;
    padding:7px 9px; background:var(--panel2);
    border-bottom:1px solid var(--border);
    flex:0 0 auto; font-size:12px;
    animation: slideDown .18s ease;
  }
  .selection-bar[hidden]{ display:none; }
  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-5px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .sel-tag{
    background:var(--accent); color:#11111b;
    padding:3px 8px; border-radius:4px;
    font-family:ui-monospace,monospace; font-weight:700; font-size:11px;
    white-space:nowrap;
  }
  .sel-tag .sel-id{ opacity:.7; font-weight:500; }
  .sel-sep{ width:1px; height:16px; background:var(--border); }
  .close-btn{
    margin-left:auto; background:transparent; border:0;
    color:var(--muted); font-size:15px; cursor:pointer;
    padding:2px 7px; border-radius:4px;
  }
  .close-btn:hover{ color:var(--red); background:rgba(243,139,168,.1); }

  .editors{ position:relative; flex:1; min-height:0; }
  .editor-wrap{
    position:absolute; inset:0;
    display:none; background:var(--panel);
  }
  .editor-wrap.active{ display:flex; }
  .gutter{
    flex:0 0 auto; width:46px;
    background:var(--gutter);
    border-right:1px solid var(--border);
    overflow:hidden; position:relative;
  }
  .gutter-inner{
    position:absolute; top:0; right:0; left:0;
    padding:14px 8px 14px 0;
    text-align:right; white-space:pre;
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#4a4a5e; user-select:none;
    will-change:transform;
  }
  .code-container{ position:relative; flex:1; min-width:0; overflow:hidden; }
  .code-container .highlight{
    position:absolute; inset:0; margin:0;
    padding:14px 16px; overflow:hidden;
    pointer-events:none;
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--text); white-space:pre; tab-size:2;
    background:transparent; border:0;
    word-break:normal; overflow-wrap:normal;
  }
  .code-container textarea{
    position:absolute; inset:0;
    width:100%; height:100%;
    padding:14px 16px; margin:0;
    border:0; outline:0; resize:none;
    background:transparent; color:transparent;
    caret-color:var(--text);
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre; tab-size:2; overflow:auto;
    word-break:normal; overflow-wrap:normal;
  }
  .code-container textarea::selection{
    background:rgba(137,180,250,0.30); color:transparent;
  }

  .tk-tag   { color:#f38ba8; }
  .tk-attr  { color:#f9e2af; }
  .tk-str   { color:#a6e3a1; }
  .tk-com   { color:#6c7086; font-style:italic; }
  .tk-kw    { color:#cba6f7; }
  .tk-num   { color:#fab387; }
  .tk-prop  { color:#89b4fa; }
  .tk-val   { color:#a6e3a1; }
  .tk-punc  { color:#9399b2; }

  .preview-head{
    display:flex; align-items:center; gap:8px; flex:0 0 auto;
    padding:6px 12px; background:var(--panel);
    border-bottom:1px solid var(--border); font-size:12px; color:var(--muted);
  }
  iframe{ flex:1; min-height:0; width:100%; border:0; background:#fff; }
  body.select-mode #previewPane::after{
    content:''; position:absolute; inset:0; z-index:20;
    pointer-events:none;
    box-shadow: inset 0 0 0 3px var(--accent);
  }

  .console{
    height:120px; flex:0 0 auto; overflow:auto;
    background:#11111b; border-top:1px solid var(--border);
    padding:6px 12px;
    font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;
  }
  .console .line{ padding:2px 0; white-space:pre-wrap; word-break:break-word; border-bottom:1px solid #1c1c2b; }
  .console .log{ color:var(--text); }
  .console .info{ color:var(--accent); }
  .console .warn{ color:var(--yellow); }
  .console .error{ color:var(--red); }
  .console .empty{ color:#45475a; font-style:italic; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--border);
    border-radius:12px; width:min(560px,100%);
    max-height:82vh; display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    animation: popIn .16s ease;
  }
  @keyframes popIn{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:scale(1); } }
  .modal h3{
    margin:0; padding:14px 18px; border-bottom:1px solid var(--border);
    font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .modal-body{ padding:14px 18px; overflow-y:auto; flex:1; }
  .modal-body label{ display:block; margin-bottom:5px; font-size:11.5px; color:var(--muted); }
  .modal-body input[type="text"], .modal-body textarea, .modal-body select{
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; color:var(--text); padding:7px 9px;
    font:12.5px ui-monospace,monospace; margin-bottom:9px;
    resize:vertical; outline:0;
  }
  .modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus{ border-color:var(--accent); }
  .modal-body textarea{ min-height:130px; }
  .modal-actions{
    display:flex; gap:8px; justify-content:flex-end;
    padding:11px 18px; border-top:1px solid var(--border);
  }
  .attr-row{ display:flex; gap:5px; margin-bottom:5px; }
  .attr-row input{ margin-bottom:0 !important; }
  .attr-row .attr-name{ flex:0 0 36%; }
  .attr-row .attr-value{ flex:1; }
  .attr-row .remove-attr{
    flex:0 0 auto; background:transparent; border:1px solid var(--border);
    color:var(--red); border-radius:5px; width:32px; cursor:pointer; font-size:12px;
  }
  .attr-row .remove-attr:hover{ background:rgba(243,139,168,.12); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--green); color:#11111b;
    padding:9px 20px; border-radius:8px; font-size:12.5px; font-weight:600;
    z-index:10000; box-shadow:0 6px 24px rgba(0,0,0,.35);
    animation: toastIn .22s cubic-bezier(.2,1.2,.4,1);
    white-space:nowrap;
  }
  .toast.error{ background:var(--red); }
  .toast.fade{ opacity:0; transition:opacity .3s; }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,14px); } to{ opacity:1; transform:translate(-50%,0); } }

  @media (max-width: 860px){
    main{ flex-direction:column; }
    #editorPane{ width:100% !important; height:45%; }
    .splitter{ display:none; }
    #previewPane{ height:55%; }
    .console{ height:80px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">⚡ Live HTML Tester</div>
    <label class="switch">
      <input type="checkbox" id="autoToggle" checked>
      <span>อัตโนมัติ</span>
    </label>
    <button class="btn" id="selectModeBtn" aria-pressed="false">🎯 เลือก element</button>
    <span class="status" id="status">พร้อม</span>
    <div class="spacer"></div>
    <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
    <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z / Ctrl+Y)" aria-label="Redo" disabled>↷</button>
    <button class="btn" id="saveBtn" title="บันทึกโค้ด (Ctrl+S)">💾 บันทึก</button>
    <button class="btn export" id="exportBtn" title="Export .html (Ctrl+Shift+S)">⬇ Export</button>
    <button class="btn primary" id="runBtn">▶ รัน (Ctrl+Enter)</button>
    <button class="btn" id="resetBtn">รีเซ็ต</button>
  </header>

  <main id="main">

    <section class="pane" id="editorPane">
      <div class="tabs" role="tablist" aria-label="ภาษาโค้ด">
        <button class="tab active" data-target="html" role="tab" aria-selected="true">HTML</button>
        <button class="tab" data-target="css" role="tab" aria-selected="false">CSS</button>
        <button class="tab" data-target="js" role="tab" aria-selected="false">JS</button>
      </div>

      <div class="selection-bar" id="selectionBar" role="toolbar" aria-label="เครื่องมือแก้ไข element" hidden>
        <span class="sel-tag" id="selTag">&lt;div&gt;</span>
        <div class="sel-sep"></div>
        <button class="btn tiny" data-action="copy-html">📋 HTML</button>
        <button class="btn tiny" data-action="copy-text">📋 Text</button>
        <button class="btn tiny" data-action="copy-selector">📋 Selector</button>
        <button class="btn tiny" data-action="copy-jsx">📋 JSX</button>
        <div class="sel-sep"></div>
        <button class="btn tiny" data-action="edit-text">✏️ Text</button>
        <button class="btn tiny" data-action="edit-attrs">🎨 Attrs</button>
        <button class="btn tiny" data-action="edit-style">💅 Style</button>
        <button class="btn tiny" data-action="edit-html">🧩 HTML</button>
        <button class="btn tiny" data-action="rename-tag">🏷️ Tag</button>
        <div class="sel-sep"></div>
        <button class="btn tiny" data-action="wrap">📦 Wrap</button>
        <button class="btn tiny" data-action="duplicate">⧉ Duplicate</button>
        <button class="btn tiny" data-action="reset-size">⟲ Size</button>
        <div class="sel-sep"></div>
        <button class="btn tiny" data-action="find">🔍 หาในโค้ด</button>
        <button class="btn tiny" data-action="delete">🗑️ ลบ</button>
        <button class="close-btn" id="selClose" title="ปิด (Esc)">✖</button>
      </div>

      <div class="editors">
        <div class="editor-wrap active" data-lang="html">
          <div class="gutter"><div class="gutter-inner" id="gutter-html"></div></div>
          <div class="code-container">
            <pre class="highlight" id="highlight-html" aria-hidden="true"></pre>
            <textarea id="html" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="โค้ด HTML"></textarea>
          </div>
        </div>
        <div class="editor-wrap" data-lang="css">
          <div class="gutter"><div class="gutter-inner" id="gutter-css"></div></div>
          <div class="code-container">
            <pre class="highlight" id="highlight-css" aria-hidden="true"></pre>
            <textarea id="css" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="โค้ด CSS"></textarea>
          </div>
        </div>
        <div class="editor-wrap" data-lang="js">
          <div class="gutter"><div class="gutter-inner" id="gutter-js"></div></div>
          <div class="code-container">
            <pre class="highlight" id="highlight-js" aria-hidden="true"></pre>
            <textarea id="js" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="โค้ด JavaScript"></textarea>
          </div>
        </div>
      </div>
    </section>

    <div class="splitter" id="splitter"></div>

    <section class="pane" id="previewPane">
      <div class="preview-head">
        <span>ผลลัพธ์</span>
        <div class="spacer"></div>
        <button class="btn tiny" id="clearConsole">ล้าง console</button>
      </div>
      <iframe id="preview" title="ผลลัพธ์ HTML" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-pointer-lock"></iframe>
      <div class="console" id="console" role="log" aria-live="polite" aria-label="Console"></div>
    </section>

  </main>
</div>

<script>
/* ================= Elements ================= */
const els = {
  html: document.getElementById('html'),
  css: document.getElementById('css'),
  js: document.getElementById('js'),
  frame: document.getElementById('preview'),
  console: document.getElementById('console'),
  status: document.getElementById('status'),
  auto: document.getElementById('autoToggle'),
  run: document.getElementById('runBtn'),
  reset: document.getElementById('resetBtn'),
  save: document.getElementById('saveBtn'),
  export: document.getElementById('exportBtn'),
  undoBtn: document.getElementById('undoBtn'),
  redoBtn: document.getElementById('redoBtn'),
  clear: document.getElementById('clearConsole'),
  splitter: document.getElementById('splitter'),
  editorPane: document.getElementById('editorPane'),
  main: document.getElementById('main'),
  selectModeBtn: document.getElementById('selectModeBtn'),
  selectionBar: document.getElementById('selectionBar'),
  selTag: document.getElementById('selTag'),
  selClose: document.getElementById('selClose'),
};

/* ================= Defaults / Storage ================= */
const STORAGE_KEY = 'live-html-tester-v7';
const SAVE_DEBOUNCE = 400;

const DEFAULTS = { html: '', css: '', js: '' };

function loadState(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch(e){}
  const s = saved || DEFAULTS;
  els.html.value = s.html ?? '';
  els.css.value  = s.css  ?? '';
  els.js.value   = s.js   ?? '';
}

function persistState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      html: els.html.value, css: els.css.value, js: els.js.value
    }));
    return true;
  } catch(e){
    return false;
  }
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistState, SAVE_DEBOUNCE);
}

/* ================= History ================= */
const historyStore = {
  stack: [], index: -1, maxSize: 120,
  debounceTimer: null, isRestoring: false,
};

function snapshot(){
  return JSON.stringify({ h: els.html.value, c: els.css.value, j: els.js.value });
}
function pushHistory(){
  if (historyStore.isRestoring) return;
  const s = snapshot();
  if (historyStore.index >= 0 && historyStore.stack[historyStore.index] === s) return;
  historyStore.stack = historyStore.stack.slice(0, historyStore.index + 1);
  historyStore.stack.push(s);
  if (historyStore.stack.length > historyStore.maxSize) historyStore.stack.shift();
  historyStore.index = historyStore.stack.length - 1;
  updateHistoryButtons();
}
function scheduleHistoryPush(){
  if (historyStore.isRestoring) return;
  clearTimeout(historyStore.debounceTimer);
  historyStore.debounceTimer = setTimeout(pushHistory, 450);
}
function applyHistoryState(str){
  historyStore.isRestoring = true;
  try {
    const s = JSON.parse(str);
    els.html.value = s.h; els.css.value = s.c; els.js.value = s.j;
    refreshEditor('html'); refreshEditor('css'); refreshEditor('js');
    saveState(); clearSelection(); run();
  } finally { historyStore.isRestoring = false; }
}
function undo(){
  clearTimeout(historyStore.debounceTimer);
  if (historyStore.index <= 0){ toast('ไม่มีอะไรให้ย้อนกลับ', 'error'); return; }
  historyStore.index--;
  applyHistoryState(historyStore.stack[historyStore.index]);
  updateHistoryButtons();
  toast('↶ ย้อนกลับ');
}
function redo(){
  clearTimeout(historyStore.debounceTimer);
  if (historyStore.index >= historyStore.stack.length - 1){ toast('ไม่มีอะไรให้ทำซ้ำ', 'error'); return; }
  historyStore.index++;
  applyHistoryState(historyStore.stack[historyStore.index]);
  updateHistoryButtons();
  toast('↷ ทำซ้ำ');
}
function updateHistoryButtons(){
  els.undoBtn.disabled = historyStore.index <= 0;
  els.redoBtn.disabled = historyStore.index >= historyStore.stack.length - 1;
  els.undoBtn.title = 'Undo (Ctrl+Z) — ' + Math.max(0, historyStore.index) + ' ขั้น';
  els.redoBtn.title = 'Redo (Ctrl+Shift+Z) — ' + Math.max(0, historyStore.stack.length - 1 - historyStore.index) + ' ขั้น';
}

/* ================= State ================= */
let selectMode = false;
let selection = { info: null, sourceLoc: null };

/* ================= Syntax highlight ================= */
function escHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function hlHTML(code){
  let out = ''; let i = 0;
  while (i < code.length){
    if (code.slice(i, i+4) === '<!--'){
      const end = code.indexOf('-->', i+4);
      if (end !== -1){
        out += '<span class="tk-com">' + escHTML(code.slice(i, end+3)) + '</span>';
        i = end + 3; continue;
      }
    }
    if (code[i] === '<'){
      const end = code.indexOf('>', i);
      if (end !== -1){
        const tag = code.slice(i, end+1);
        let inner = escHTML(tag);
        inner = inner.replace(/([a-zA-Z][\w-]*)\s*=\s*("[^"]*"|'[^']*')/g,
          '<span class="tk-attr">$1</span>=<span class="tk-str">$2</span>');
        inner = inner.replace(/^(&lt;\/?)([a-zA-Z][\w-]*)/, '$1<span class="tk-tag">$2</span>');
        out += inner; i = end + 1; continue;
      }
    }
    out += escHTML(code[i]); i++;
  }
  return out;
}
function hlCSS(code){
  let s = escHTML(code);
  const blocks = [];
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => { blocks.push(m); return '\x00C' + (blocks.length-1) + '\x00'; });
  const strs = [];
  s = s.replace(/("[^"]*"|'[^']*')/g, m => { strs.push(m); return '\x00S' + (strs.length-1) + '\x00'; });
  s = s.replace(/([a-zA-Z-]+)(\s*:\s*)([^;{}]+)/g,
    '<span class="tk-prop">$1</span><span class="tk-punc">$2</span><span class="tk-val">$3</span>');
  s = s.replace(/\x00S(\d+)\x00/g, (m,i) => '<span class="tk-str">' + strs[i] + '</span>');
  s = s.replace(/\x00C(\d+)\x00/g, (m,i) => '<span class="tk-com">' + blocks[i] + '</span>');
  return s;
}
const JS_KEYWORDS = 'function|const|let|var|if|else|for|while|return|new|class|this|typeof|instanceof|true|false|null|undefined|async|await|try|catch|finally|throw|switch|case|break|continue|do|in|of|delete|void|yield|import|export|from|as|default|extends|super|static|get|set';
function hlJS(code){
  let s = escHTML(code);
  const blocks = [];
  s = s.replace(/\/\*[\s\S]*?\*\//g, m => { blocks.push(m); return '\x00C' + (blocks.length-1) + '\x00'; });
  const strs = [];
  s = s.replace(/(["'`])(?:(?!\1)[^\\]|\\.)*\1/g, m => { strs.push(m); return '\x00S' + (strs.length-1) + '\x00'; });
  s = s.replace(/\/\/[^\n]*/g, m => { blocks.push(m); return '\x00C' + (blocks.length-1) + '\x00'; });
  s = s.replace(new RegExp('\\b(' + JS_KEYWORDS + ')\\b', 'g'), '<span class="tk-kw">$1</span>');
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tk-num">$1</span>');
  s = s.replace(/\x00S(\d+)\x00/g, (m,i) => '<span class="tk-str">' + strs[i] + '</span>');

/* ================= Editor refs ================= */
const editorRefs = {};
['html','css','js'].forEach(lang => {
  editorRefs[lang] = {
    ta: document.getElementById(lang),
    pre: document.getElementById('highlight-' + lang),
    gutter: document.getElementById('gutter-' + lang),
    wrap: document.querySelector('.editor-wrap[data-lang="' + lang + '"]'),
  };
});

const HIGHLIGHT_LIMIT = 200000;
function refreshEditor(lang){
  const { ta, pre, gutter } = editorRefs[lang];
  const val = ta.value;
  if (val.length < HIGHLIGHT_LIMIT) pre.innerHTML = HL[lang](val) + '\n';
  else pre.textContent = val + '\n';
  const totalLines = val.split('\n').length;
  let g = '';
  for (let i = 1; i <= totalLines; i++) g += i + '\n';
  gutter.textContent = g;
  syncEditorScroll(lang);
}
function syncEditorScroll(lang){
  const { ta, pre, gutter } = editorRefs[lang];
  pre.scrollTop = ta.scrollTop;
  pre.scrollLeft = ta.scrollLeft;

}

        positionOverlay(currentEl); positionHandles();
        sendUpdate(currentEl, 'wrap');
      } catch(err){
        post('opError', { action: 'wrap', message: err.message });
      }
    }
    if (d.cmd === 'resetSize' && currentEl){
      var orig = originalStyles.get(currentEl);
      if (orig){
        ['position','display','boxSizing','left','top','width','height'].forEach(function(p){
          currentEl.style[p] = orig[p] || '';
        });
        originalStyles.delete(currentEl);
      } else {
        currentEl.style.width = '';
        currentEl.style.height = '';
        currentEl.style.left = '';
        currentEl.style.top = '';
      }
      if (currentEl.getAttribute('style') === '') currentEl.removeAttribute('style');
      positionOverlay(currentEl); positionHandles();
      sendUpdate(currentEl, 'reset-size');
    }
    if (d.cmd === 'delete' && currentEl){
      var target = currentEl;
      if (!target.parentNode){
        post('opError', { action: 'delete', message: 'element นี้ไม่ได้อยู่ในหน้า' });
        return;
      }
      currentEl = null;
      hideAll();
      target.parentNode.removeChild(target);
      post('deleted', {});
    }
  });

  try { post('ready', {}); } catch(e){}
})();
`;

/* ================= Build preview ================= */
function buildSrcdoc(){
  const safeJS  = els.js.value.replace(/<\/script/gi, '<\\/script');
  const safeCSS = els.css.value.replace(/<\/style/gi,  '<\\/style');
  return `<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><style data-live-ui="1">${safeCSS}</style>
<script data-live-ui="1">
(function(){
  var send = function(kind, args){
    try{
      var parts = Array.prototype.map.call(args, function(a){
        if (typeof a === 'string') return a;
        try { return JSON.stringify(a); } catch(e){ return String(a); }
      });
      parent.postMessage({ source:'live-html-tester', kind:kind, msg:parts.join(' ') }, '*');
    }catch(e){}
  };
  ['log','info','warn','error','debug'].forEach(function(m){
    var orig = console[m];
    console[m] = function(){ send(m, arguments); if(orig) orig.apply(console, arguments); };
  });
  window.onerror = function(msg, src, line, col){
    send('error', ['❌ ' + msg + (line ? '  (บรรทัด ' + line + ':' + col + ')' : '')]);
    return false;
  };
  window.addEventListener('unhandledrejection', function(e){
    send('error', ['❌ Unhandled Promise: ' + ((e.reason && e.reason.message) || e.reason)]);
  });
})();
<\/script>
</head>
<body>
${els.html.value}
<script data-live-ui="1">${safeJS}<\/script>
<script data-live-ui="1">${SELECTOR_SCRIPT}<\/script>
</body>
</html>`;
}

/* ================= Source locator ================= */
function escapeRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const VOID_TAGS = ['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'];

const SKIP_CONTENT_TAGS = ['script','style','textarea','title','template','xmp','iframe','noembed','noframes','noscript','plaintext'];

/* หา index ของ '>' ที่ปิด open tag โดยไม่นับ '>' ที่อยู่ใน quote */
function openTagEnd(src, start){
  let quote = null;
  for (let i = start + 1; i < src.length; i++){
    const c = src[i];
    if (quote){
      if (c === quote) quote = null;
    } else if (c === '"' || c === "'"){
      quote = c;
    } else if (c === '>'){
      return i + 1;
    }
  }
  return -1;
}

function findCloseTag(src, from, name){
  const re = new RegExp('</' + escapeRe(name) + '\\s*>', 'gi');
  re.lastIndex = from;
  const m = re.exec(src);
  return m ? { start: m.index, end: m.index + m[0].length } : null;
}

/* อ่าน attribute จาก open tag แบบหยาบ (รองรับ quote และ unquoted value) */
function parseOpenTagAttrs(raw){
  const attrs = {};
  const body = raw.replace(/^<\s*[^\s/>]+/, '').replace(/\/?\s*>$/, '');
  const re = /([^\s"'<>/=]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g;
  let m;
  while ((m = re.exec(body))){
    const name = m[1].toLowerCase();
    if (name in attrs) continue;
    attrs[name] = m[2] !== undefined ? m[2] : m[3] !== undefined ? m[3] : m[4] !== undefined ? m[4] : '';
  }
  return attrs;
}

/* สแกน open tag ทั้งหมดในซอร์ส โดยข้าม comment และเนื้อใน script/style/template */
function scanTags(src){
  const tags = [];
  let i = 0;
  while (i < src.length){
    const lt = src.indexOf('<', i);
    if (lt === -1) break;
    if (src.startsWith('<!--', lt)){
      const end = src.indexOf('-->', lt + 4);
      i = end === -1 ? src.length : end + 3;
      continue;
    }
    if (src.startsWith('<!', lt) || src.startsWith('<?', lt)){
      const end = src.indexOf('>', lt + 2);
      i = end === -1 ? src.length : end + 1;
      continue;
    }
    const m = /^<([a-zA-Z][\w:-]*)/.exec(src.slice(lt, lt + 80));
    if (!m){ i = lt + 1; continue; }
    const openEnd = openTagEnd(src, lt);
    if (openEnd === -1) break;
    const name = m[1].toLowerCase();
    const raw = src.slice(lt, openEnd);
    tags.push({ start: lt, openEnd, name, raw, attrs: parseOpenTagAttrs(raw) });
    i = openEnd;
    if (SKIP_CONTENT_TAGS.includes(name)){
      const close = findCloseTag(src, openEnd, name);
      if (!close) break;
      i = close.end;
    }
  }
  return tags;
}

/* หาจุดสิ้นสุดของ element; คืน -1 เมื่อไม่พบแท็กปิด (ปลอดภัยกว่าการเดา) */
function findElementEnd(src, startIdx, tag){
  const t = String(tag).toLowerCase();
  const openEnd = openTagEnd(src, startIdx);
  if (openEnd === -1) return -1;
  if (VOID_TAGS.includes(t)) return openEnd;
  if (SKIP_CONTENT_TAGS.includes(t)){
    const close = findCloseTag(src, openEnd, t);
    return close ? close.end : -1;
  }
  if (/\/\s*>$/.test(src.slice(startIdx, openEnd))) return openEnd;

  let depth = 1;
  let i = openEnd;
  while (i < src.length){
    const lt = src.indexOf('<', i);
    if (lt === -1) return -1;
    if (src.startsWith('<!--', lt)){
      const end = src.indexOf('-->', lt + 4);
      if (end === -1) return -1;
      i = end + 3;
      continue;
    }
    if (src.startsWith('<!', lt) || src.startsWith('<?', lt)){
      const end = src.indexOf('>', lt + 2);
      if (end === -1) return -1;
      i = end + 1;
      continue;
    }
    const close = /^<\/([a-zA-Z][\w:-]*)\s*>/.exec(src.slice(lt, lt + 80));
    if (close){
      if (close[1].toLowerCase() === t){
        depth--;
        if (depth === 0) return lt + close[0].length;
      }
      i = lt + close[0].length;
      continue;
    }
    const open = /^<([a-zA-Z][\w:-]*)/.exec(src.slice(lt, lt + 80));
    if (!open){ i = lt + 1; continue; }
    const name = open[1].toLowerCase();
    const end = openTagEnd(src, lt);
    if (end === -1) return -1;
    if (name === t && !/\/\s*>$/.test(src.slice(lt, end))) depth++;
    i = end;
    if (SKIP_CONTENT_TAGS.includes(name)){
      const closeTag = findCloseTag(src, end, name);
      if (!closeTag) return -1;
      i = closeTag.end;
    }
  }
  return -1;
}

function sourceClasses(attr){
  return [...new Set(String(attr || '').split(/\s+/).filter(Boolean))].sort();
}
function tagSignature(tag, id, classAttr){
  return String(tag).toLowerCase() + '|' + String(id || '') + '|' + sourceClasses(classAttr).join(' ');
}
function normalizedText(s){
  return String(s || '').replace(/\s+/g, ' ').trim();
}
function textMatchesSource(snippet, info){
  const want = normalizedText(info.text);
  if (!want) return true;
  const tpl = document.createElement('template');
  try { tpl.innerHTML = snippet; } catch(e){ return false; }
  return normalizedText(tpl.content.textContent || '') === want;
}
function validLoc(loc, src){
  return loc && Number.isInteger(loc.start) && Number.isInteger(loc.end)
    && loc.start >= 0 && loc.end > loc.start && loc.end <= src.length ? loc : null;
}

function locateInSource(info){
  if (!info) return null;
  const src = els.html.value;
  const tag = String(info.tag || '').toLowerCase();
  if (!tag) return null;

  const tags = scanTags(src).filter(t => t.name === tag);
  if (!tags.length) return null;

  const wantSig = info.sig || tagSignature(tag, info.id, info.className);
  let candidates = tags.filter(t => tagSignature(t.name, t.attrs.id, t.attrs.class) === wantSig);

  if (!candidates.length && info.id){
    candidates = tags.filter(t => t.attrs.id === info.id);
  }
  if (!candidates.length){
    const open = String(info.outerHTML || '').match(/^<[a-zA-Z][\w:-]*[^>]*>/);
    if (open){
      const exact = tags.filter(t => t.raw === open[0]);
      if (exact.length === 1) candidates = exact;
    }
  }
  if (!candidates.length) return null;

  const multi = candidates.length > 1;
  let index = Number.isInteger(info.sigIndex) && info.sigIndex >= 0 ? info.sigIndex : null;
  if (index === null){
    if (multi) return null;
    index = 0;
  }
  if (index >= candidates.length) return null;

  const pick = candidates[index];
  const pickEnd = findElementEnd(src, pick.start, tag);
  if (pickEnd === -1) return null;
  if (multi && !textMatchesSource(src.slice(pick.start, pickEnd), info)) return null;
  return { start: pick.start, end: pickEnd };
}

function selectRange(start, end){
  document.querySelector('.tab[data-target="html"]').click();
  els.html.focus();
  els.html.setSelectionRange(start, end);
  const cs = getComputedStyle(els.html);
  const lineHeight = parseFloat(cs.lineHeight) || 21;
  const linesBefore = els.html.value.slice(0, start).split('\n').length;
  els.html.scrollTop = Math.max(0, (linesBefore - 4) * lineHeight);
  syncEditorScroll('html');
}

/* ================= Sync to source ================= */
function syncToSource(newHTML, opts){
  const src = els.html.value;
  let loc = validLoc(selection.sourceLoc, src);
  if (!loc){
    selection.sourceLoc = null;
    loc = locateInSource(selection.info);
    if (loc) selection.sourceLoc = { start: loc.start, end: loc.end };
  }
  if (!loc){ toast('ซิงค์ลงโค้ดไม่ได้ (หา element นี้ในโค้ดไม่ชัดเจน)', 'error'); return; }
  const scrollTop = els.html.scrollTop, scrollLeft = els.html.scrollLeft;
  if (opts && opts.duplicate){
    els.html.value = src.slice(0, loc.end) + '\n' + newHTML + src.slice(loc.end);
    selection.sourceLoc = { start: loc.end + 1, end: loc.end + 1 + newHTML.length };
  } else {
    els.html.value = src.slice(0, loc.start) + newHTML + src.slice(loc.end);
    selection.sourceLoc = { start: loc.start, end: loc.start + newHTML.length };
  }
  refreshEditor('html');
  els.html.scrollTop = scrollTop;
  els.html.scrollLeft = scrollLeft;
  syncEditorScroll('html');
  saveState();
  pushHistory();
}

function removeFromSource(){
  const src = els.html.value;
  const loc = validLoc(selection.sourceLoc, src) || locateInSource(selection.info);
  if (!loc){ toast('ลบใน preview แล้ว (ลบในโค้ดไม่ได้)', 'error'); return; }
  const scrollTop = els.html.scrollTop, scrollLeft = els.html.scrollLeft;
  els.html.value = src.slice(0, loc.start) + src.slice(loc.end);
  refreshEditor('html');
  els.html.scrollTop = scrollTop;
  els.html.scrollLeft = scrollLeft;
  syncEditorScroll('html');
  selection.sourceLoc = null;
  saveState();
  pushHistory();
}

/* ================= Clipboard ================= */
async function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;left:-9999px;';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch(e){ return false; }
}

/* ================= Selector / JSX ================= */
function cssEscapeIdent(s){
  if (typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(String(s));
  return String(s).replace(/([^\w-])/g, '\\$1');
}
function buildSelector(info){
  if (info.id) return '#' + cssEscapeIdent(info.id);
  let sel = cssEscapeIdent(info.tag);
  if (info.className){
    const cls = info.className.split(/\s+/).filter(Boolean);
    if (cls.length) sel += '.' + cls.map(cssEscapeIdent).join('.');
  }
  return sel;
}
function toJSX(html){
  let s = html;
  s = s.replace(/\bclass=/g, 'className=');
  s = s.replace(/\bfor=/g, 'htmlFor=');
  s = s.replace(/\b(aria-[a-z]+)=/g, (m, a) => a.replace(/-([a-z])/g, (_, c) => c.toUpperCase()) + '=');
  s = s.replace(/tabindex=/g, 'tabIndex=');
  VOID_TAGS.forEach(t => {
    const re = new RegExp('<' + t + '(\\s[^>]*)?>', 'gi');
    s = s.replace(re, (m, attrs) => (/\/\s*>$/.test(m) ? m : '<' + t + (attrs || '') + ' />'));
  });
  return s;
}

/* ================= Modal ================= */
function openModal(title, buildBody, onSave){
  const prevFocus = document.activeElement;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-label', title);
  modal.innerHTML = `
    <h3>${escapeHtml(title)}</h3>
    <div class="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" data-act="cancel">ยกเลิก</button>
      <button class="btn primary" data-act="save">บันทึก</button>
    </div>`;
  const body = modal.querySelector('.modal-body');
  buildBody(body);
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  const close = () => {
    backdrop.remove();
    if (prevFocus && prevFocus.focus) prevFocus.focus();
  };
  modal.querySelector('[data-act="cancel"]').onclick = close;
  modal.querySelector('[data-act="save"]').onclick = () => {
    if (onSave() !== false) close();
  };
  backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close(); });
  backdrop.tabIndex = -1;
  backdrop.focus();
  backdrop.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) modal.querySelector('[data-act="save"]').click();
  });
  const first = modal.querySelector('input, textarea, select');
  if (first) setTimeout(() => { first.focus(); first.select && first.select(); }, 30);
}

  const ta = document.createElement('textarea'); ta.value = getElementSource();
  body.appendChild(lab); body.appendChild(ta);
  openModal('🧩 แก้ HTML ของ <' + selection.info.tag + '>', (b) => { b.appendChild(body); }, () => {
    const tpl = document.createElement('template');
    tpl.innerHTML = ta.value;
    if (!tpl.content.firstElementChild){
      toast('HTML ไม่ถูกต้อง หรือไม่มี element หลัก', 'error');
      return false;
    }
    sendToFrame({ cmd: 'setOuterHTML', value: ta.value });
  });
}

function actRenameTag(){
  if (!selection.info) return;
  const body = document.createElement('div');
  const lab = document.createElement('label'); lab.textContent = 'ชื่อแท็กใหม่ (เช่น div, span, section)';
  const inp = document.createElement('input'); inp.type='text'; inp.value = selection.info.tag;
  body.appendChild(lab); body.appendChild(inp);
  openModal('🏷️ เปลี่ยนแท็ก', (b) => { b.appendChild(body); }, () => {
    const tag = inp.value.trim().toLowerCase();
    if (!/^[a-z][a-z0-9-]*$/.test(tag)){ toast('ชื่อแท็กไม่ถูกต้อง', 'error'); return false; }
    if (VOID_TAGS.includes(tag)){ toast('เปลี่ยนเป็นแท็ก void ไม่ได้', 'error'); return false; }
    sendToFrame({ cmd: 'renameTag', tag });
  });
}

function actWrap(){
  if (!selection.info) return;
  const body = document.createElement('div');
  const lab1 = document.createElement('label'); lab1.textContent = 'แท็กที่ใช้ห่อ';
  const inp1 = document.createElement('input'); inp1.type='text'; inp1.value='div'; inp1.placeholder='div';
  const lab2 = document.createElement('label'); lab2.textContent = 'class (ไม่ใส่ก็ได้)';
  const inp2 = document.createElement('input'); inp2.type='text'; inp2.placeholder='wrapper';
  body.appendChild(lab1); body.appendChild(inp1); body.appendChild(lab2); body.appendChild(inp2);
  openModal('📦 ห่อ element ด้วยแท็กใหม่', (b) => { b.appendChild(body); }, () => {
    const tag = inp1.value.trim().toLowerCase() || 'div';
    if (!/^[a-z][a-z0-9-]*$/.test(tag)){ toast('ชื่อแท็กไม่ถูกต้อง', 'error'); return false; }
    if (VOID_TAGS.includes(tag)){ toast('ห่อด้วยแท็ก void ไม่ได้', 'error'); return false; }
    sendToFrame({ cmd: 'wrap', tag, className: inp2.value.trim() });
  });
}

function actDuplicate(){
  if (!selection.info) return;
  sendToFrame({ cmd: 'duplicate' });
}

function actResetSize(){
  if (!selection.info) return;
  sendToFrame({ cmd: 'resetSize' });
}

function actDelete(){
  if (!selection.info) return;
  if (!confirm('ลบ <' + selection.info.tag + '> ออกจาก preview?\n(ถ้าซิงค์ได้ จะลบออกจากโค้ดด้วย)')) return;
  sendToFrame({ cmd: 'delete' });
}

/* ================= Export / Save ================= */
function downloadHTML(filename){
  const cssEsc = els.css.value.replace(/<\/style/gi, '<\\/style');
  const jsEsc  = els.js.value.replace(/<\/script/gi, '<\\/script');
  const title  = filename.replace(/\.html?$/i, '');
  const doc = `<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
${cssEsc}
</style>
</head>
<body>
${els.html.value}
<script>
${jsEsc}
<\/script>
</body>
</html>`;
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function actExport(){
  let filenameInput;
  openModal('⬇ Export เป็นไฟล์ HTML', (b) => {
    const lab = document.createElement('label');
    lab.textContent = 'ชื่อไฟล์ (จะเติม .html ให้อัตโนมัติ)';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = 'index';
    inp.placeholder = 'my-page';
    b.appendChild(lab);
    b.appendChild(inp);
    filenameInput = inp;
  }, () => {
    let name = (filenameInput.value || 'index').trim();
    name = name.replace(/\.html?$/i, '').replace(/[\\/:*?"<>|]/g, '_').trim() || 'index';
    const filename = name + '.html';
    downloadHTML(filename);
    toast('ดาวน์โหลดแล้ว: ' + filename);
  });
}

function actSave(){
  clearTimeout(historyStore.debounceTimer);
  pushHistory();
  if (persistState()) toast('บันทึกโค้ดลงเครื่องแล้ว ✓');
  else toast('บันทึกไม่สำเร็จ', 'error');
}

/* ================= Message handler ================= */
window.addEventListener('message', (e) => {
  if (e.source !== els.frame.contentWindow) return;
  const d = e.data;
  if (!d || d.source !== 'live-html-tester') return;

  if (d.kind === 'ready'){
    if (selectMode) sendToFrame({ cmd: 'selectMode', value: true });
    return;
  }
  if (d.kind === 'select'){
    selection.info = d.info;
    selection.sourceLoc = locateInSource(d.info);
    showSelectionBar(d.info);
    if (!selection.sourceLoc){
      toast('หา element นี้ในโค้ดไม่ชัดเจน — จะแก้ได้เฉพาะใน preview', 'error');
    }
    return;
  }
  if (d.kind === 'dblclick'){
    selection.info = d.info;
    selection.sourceLoc = locateInSource(d.info);
    showSelectionBar(d.info);
    if (selection.sourceLoc){
      selectRange(selection.sourceLoc.start, selection.sourceLoc.end);
      els.editorPane.classList.add('pane-flash');
      setTimeout(() => els.editorPane.classList.remove('pane-flash'), 700);
      toast('กระโดดไปที่ <' + d.info.tag + '> ในโค้ดแล้ว');
    } else {
      toast('หา element ในโค้ดไม่เจอ', 'error');
    }
    return;
  }
  if (d.kind === 'updated'){
    selection.info = d.info;
    showSelectionBar(d.info);
    syncToSource(d.info.outerHTML, d.action === 'duplicate' ? { duplicate: true } : null);
    return;
  }
  if (d.kind === 'deleted'){
    removeFromSource();
    clearSelection();
    toast('ลบ element แล้ว');
    return;
  }
  if (d.kind === 'opError'){
    toast('ทำรายการไม่สำเร็จ: ' + (d.message || 'ไม่ทราบสาเหตุ'), 'error');
    return;
  }
  if (d.kind === 'log' || d.kind === 'info' || d.kind === 'warn' || d.kind === 'error' || d.kind === 'debug'){
    addConsole(d.kind, d.msg);
  }
});

/* ================= Editor events ================= */
['html','css','js'].forEach(lang => {
  const { ta } = editorRefs[lang];
  ta.addEventListener('input', () => {
    refreshEditor(lang);
    if (lang === 'html' && selection.info){
      selection.sourceLoc = null;
    }
    scheduleHistoryPush();
    scheduleRun();
  });
  ta.addEventListener('scroll', () => syncEditorScroll(lang));
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.setRangeText('  ', s, en, 'end');
      refreshEditor(lang);
      scheduleHistoryPush();
      scheduleRun();
    }
  });
});

/* ================= Tabs ================= */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => {
      const active = t === tab;
      t.classList.toggle('active', active);
      t.setAttribute('aria-selected', String(active));
    });
    const lang = tab.dataset.target;
    document.querySelectorAll('.editor-wrap').forEach(w => {
      w.classList.toggle('active', w.dataset.lang === lang);
    });
    editorRefs[lang].ta.focus();
    refreshEditor(lang);
  });
});

/* ================= Buttons ================= */
els.run.addEventListener('click', run);
els.undoBtn.addEventListener('click', undo);
els.redoBtn.addEventListener('click', redo);
els.save.addEventListener('click', actSave);
els.export.addEventListener('click', actExport);
els.clear.addEventListener('click', clearConsole);
els.auto.addEventListener('change', () => {
  if (!els.auto.checked) clearTimeout(runTimer);
  els.status.textContent = els.auto.checked ? 'อัปเดตอัตโนมัติ' : 'โหมด manual';
  if (els.auto.checked) run();
});
els.reset.addEventListener('click', () => {
  if (!confirm('ล้างโค้ดทั้งหมด?')) return;
  els.html.value = '';
  els.css.value  = '';
  els.js.value   = '';
  refreshEditor('html'); refreshEditor('css'); refreshEditor('js');
  saveState();
  pushHistory();
  run();
});
els.selectModeBtn.addEventListener('click', () => setSelectMode(!selectMode));
els.selClose.addEventListener('click', () => { clearSelection(); sendToFrame({ cmd: 'deselect' }); });

els.selectionBar.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  switch (btn.dataset.action){
    case 'copy-html': actCopyHTML(); break;
    case 'copy-text': actCopyText(); break;
    case 'copy-selector': actCopySelector(); break;
    case 'copy-jsx': actCopyJSX(); break;
    case 'edit-text': actEditText(); break;
    case 'edit-attrs': actEditAttrs(); break;
    case 'edit-style': actEditStyle(); break;
    case 'edit-html': actEditHTML(); break;
    case 'rename-tag': actRenameTag(); break;
    case 'wrap': actWrap(); break;
    case 'duplicate': actDuplicate(); break;
    case 'reset-size': actResetSize(); break;
    case 'find': actFindInCode(); break;
    case 'delete': actDelete(); break;
  }
});

/* ================= Global shortcuts ================= */
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const inModal = !!document.querySelector('.modal-backdrop');
  if (inModal) return;

  if (mod && e.key.toLowerCase() === 'z'){
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && e.key.toLowerCase() === 'y'){
    e.preventDefault();
    redo();
    return;
  }
  if (mod && e.key === 'Enter'){ e.preventDefault(); run(); return; }
  if (mod && e.key.toLowerCase() === 's'){
    e.preventDefault();
    if (e.shiftKey) actExport(); else actSave();
    return;
  }
  if (e.key === 'Escape' && selection.info){
    clearSelection();
    sendToFrame({ cmd: 'deselect' });
  }
});

/* ================= Splitter ================= */
let dragging = false;
els.splitter.addEventListener('pointerdown', (e) => {
  dragging = true;
  els.splitter.setPointerCapture(e.pointerId);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
els.splitter.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const rect = els.main.getBoundingClientRect();
  let pct = ((e.clientX - rect.left) / rect.width) * 100;
  pct = Math.min(80, Math.max(20, pct));
  els.editorPane.style.width = pct + '%';
});
els.splitter.addEventListener('pointerup', (e) => {
  dragging = false;
  try { els.splitter.releasePointerCapture(e.pointerId); } catch(err){}
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

/* ================= Init ================= */
loadState();
refreshEditor('html');
refreshEditor('css');
refreshEditor('js');
clearConsole();
pushHistory();
requestAnimationFrame(run);
</script>
